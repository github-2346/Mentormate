spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: mentormate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mentormate}
    username: ${DB_USERNAME:mentoruser}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Let Hibernate auto-detect dialect — no need to specify for PG 16+
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:bWVudG9ybWF0ZS1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.mentorplatform: INFO
    org.springframework.security: WARN
    org.springframework.web.socket: WARN
