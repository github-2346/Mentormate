spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mentormate}
    username: ${DB_USERNAME:mentoruser}
    password: ${DB_PASSWORD:password}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.mentorplatform: DEBUG
    org.springframework.web.socket: INFO
