spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mentormate}
    username: ${DB_USERNAME:mentoruser}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    com.mentorplatform: WARN
    root: WARN
